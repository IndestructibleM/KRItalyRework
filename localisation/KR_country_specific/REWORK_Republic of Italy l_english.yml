 ### EVENTS
 sri_rework.1.t: "Addio, de Ambris"
 sri_rework.1.d: "Today, the Republic mourns the death of Alceste De Ambris, Prime Minister of Italy, architect of the Revolution, and chief author of the D'Annunzio Constitution. From the turbulent days of the uprising to the halls of the Senate, De Ambris stood as one of the guiding minds of the new Italy, shaping its institutions and defending its democratic-syndicalist ideals against all enemies, foreign and domestic. Across the Republic, workers' syndicates and local councils have lowered their banners in mourning as news of his passing spreads. \n\nYet grief is accompanied by uncertainty. In recent years, De Ambris had become the foremost defender of constitutional government against the growing influence of Chairman Mussolini and his allies within the FAR. With his death, one of the last giants of the Revolution has departed the stage, leaving many to wonder whether the Republic he helped create can endure without him."
 sri_rework.1.a: "The final act draws near."
 
 sri_rework.2.t: "The Revolution with a Single Voice"
 sri_rework.2.d: "The death of Alceste De Ambris has surely shaken the Republic to its core. Across Italy, workers, veterans, and revolutionaries alike have mourned the passing of one of the fathers of the Revolution. Chairman Benito Mussolini has declared that the nation cannot afford uncertainty in these perilous times. With Austria still occupying the North and enemies of the Revolution gathering abroad, he argues that divided leadership can only invite paralysis. \n\nToday, the Senate approved the unification of the offices of Chairman and Prime Minister into a single post, vesting both authorities in Mussolini himself. Supporters hail the measure as a necessary step to preserve national unity amid the turmoil in the nation and complete the work begun by D'Annunzio and De Ambris nearly two decades ago. Mussolini's critics, however, warn that the safeguards of the D'Annunzio constitution are being dismantled one by one. Whether this marks the salvation of the Revolution or the end of its democratic spirit remains to be seen, but one thing is certain: Italy now answers to a single voice."
 sri_rework.2.a: "Dux Mea Lux!"
 
 ### Decisions
 SRI_fight_mafia_cat: "Slaying the Mafia Hydra"
 SRI_fight_mafia_cat_desc: "The mafiosi have long entrenched themselves within the social and economic life of Southern Italy. The Civil War only strengthened their grip, as criminal clans exploited the collapse of state authority to expand their networks and recruit followers, infiltrating southern institutions greatly in the process. Today, the Mafia stands as a rival power within the Socialist Republic, with it controlling real territory and intimidating workers away from the light of socialism. \n\n§YUse the decisions below to conduct anti-Mafia operations, strengthen state authority, and reclaim the South for the Republic!§!" ### TOOLTIPS
 SRI_cross_the_po: "Cross the River Po"
 
 SRD_southern_infiltration_cat: "Infiltrating the Italian South"
 SRD_southern_infiltration_cat_desc: "You currently have 15 total actions available. Get more through your focus tree. \n\n(WIP) The south of Italy is in a power vacuum. The socialist republic has never been able to fully assert its control over the south outside major city centers. With catholics, royalists, and criminal organizations abundant in the rural south, it is a place of contest between the republic and its adversaries. This provides the opportunity to take advantage of this situation - we shall make contact with and befriend the various resistance groups of southern Italy." 
 
